<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  
  <title>404 — Page Not Found | SERRO</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#07080b" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" type="image/svg+xml" />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <!-- Core SERRO Stylesheet -->
  <link rel="stylesheet" href="serro.css?v=1.0.2" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #060709;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle Architectural Background Grid & Ambient Glow */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 46%, rgba(30, 41, 59, 0.3) 0%, transparent 65%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 56px 56px, 56px 56px;
      pointer-events: none;
      z-index: 1;
    }

    /* Vignette Edge Shading */
    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 50%, rgba(6, 7, 9, 0.8) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Center Stage Container */
    .error-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      width: 90%;
    }

    /* Giant 3D Beveled "404" Display */
    .error-code {
      font-size: clamp(8rem, 22vw, 15rem);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.05em;
      user-select: none;
      margin-bottom: 0.5rem;
      background: linear-gradient(180deg, #242733 0%, #15171f 65%, #0e0f14 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.09)) drop-shadow(0 20px 40px rgba(0, 0, 0, 0.95));
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
    }

    .error-code:hover {
      transform: scale(1.02);
      filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.14)) drop-shadow(0 25px 50px rgba(0, 0, 0, 0.95));
    }

    /* Hairline Divider */
    .divider {
      width: 44px;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      margin: 1.25rem auto 1.25rem;
    }

    /* Subtitle "PAGE NOT FOUND" */
    .error-title {
      font-size: clamp(0.78rem, 1.8vw, 0.92rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }

    /* Context Description */
    .error-desc {
      font-size: clamp(0.9rem, 2vw, 1rem);
      color: #64748b;
      line-height: 1.6;
      max-width: 390px;
      margin: 0 auto 2.25rem;
      font-weight: 400;
    }

    /* Sleek Dark Pill Button */
    .back-home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.78rem 1.65rem;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .back-home-btn .arrow-icon {
      font-size: 1rem;
      line-height: 1;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .back-home-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.24);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 24px rgba(56, 189, 248, 0.12);
    }

    .back-home-btn:hover .arrow-icon {
      transform: translateX(-4px);
    }

    .back-home-btn:active {
      transform: translateY(0);
    }

    /* Bottom Watermark / Brand Badge */
    .footer-watermark {
      position: absolute;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
    }

    .footer-watermark a {
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.28em;
      color: #334155;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .footer-watermark a:hover {
      color: #64748b;
      text-shadow: 0 0 12px rgba(100, 116, 139, 0.3);
    }
  </style>
</head>
<body>

  <!-- Ambient Grid Background -->
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>

  <!-- Center Content with SERRO Motion Trigger -->
  <main class="error-container" data-serro="blur-up" data-serro-duration="1400">
    <!-- Giant Stealth 3D 404 -->
    <h1 class="error-code" aria-label="Error 404">404</h1>

    <!-- Minimal Hairline Divider -->
    <div class="divider"></div>

    <!-- Page Status -->
    <h2 class="error-title">Page Not Found</h2>

    <!-- Subtext -->
    <p class="error-desc">
      The page you're looking for doesn't exist or has been moved.
    </p>

    <!-- Back to Home Action Button -->
    <a href="./" class="back-home-btn">
      <span class="arrow-icon">&larr;</span>
      <span>Back to Home</span>
    </a>
  </main>

  <!-- Bottom Brand Watermark -->
  <footer class="footer-watermark">
    <a href="./" title="SERRO Viewport Motion Engine">SERRO</a>
  </footer>

  <!-- SERRO Standalone Script -->
  <script src="serro.js?v=1.0.2"></script>
</body>
</html>
